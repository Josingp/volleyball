<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>좌석 확인 — 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--navy:#1B1760;--orange:#E97132;--line:#E3E4EF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;background:#F6F6FA;color:#222;padding:26px 16px 60px}
.wrap{max-width:680px;margin:0 auto}
h1{font-size:22px;color:var(--navy)}
h1 small{font-size:13px;color:#888;font-weight:600;margin-left:8px}
.sec{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
.sec h2{font-size:15px;color:var(--navy);margin-bottom:12px}
label{display:block;font-size:12.5px;font-weight:700;color:#666;margin:10px 0 5px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:500 14.5px/1.5 inherit;background:#fff}
input:focus,textarea:focus{outline:none;border-color:var(--navy)}
textarea{min-height:180px;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:10px;background:var(--navy);color:#fff;font:700 14.5px inherit;padding:11px 18px;cursor:pointer;margin-top:12px}
button.warn{background:var(--orange)}
button.sub{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
button:disabled{opacity:.5;cursor:wait}
.out{margin-top:12px;font-size:13.5px;line-height:1.7;white-space:pre-wrap;border-radius:10px;padding:12px;display:none}
.out.ok{display:block;background:#EBF7EE;color:#166534}
.out.bad{display:block;background:#FDECEC;color:#B91C1C}
.help{font-size:12.5px;color:#777;line-height:1.7;margin-top:8px}
.help code{background:#F0F0F6;border-radius:5px;padding:1px 6px;font-size:12px}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;margin-top:4px}
.stat b{font-size:20px;color:var(--navy)}
</style>
</head>
<body>
<div class="wrap">
  <h1>좌석 확인 관리자<small>신인감독 김연경2 직관</small></h1>

  <div class="sec">
    <h2>1. 관리자 키</h2>
    <input id="key" type="password" placeholder="관리자 키 입력" autocomplete="current-password">
    <button id="btnStatus">현황 불러오기</button>
    <div class="stat" id="stat"></div>
    <div class="out" id="outStatus"></div>
  </div>

  <div class="sec">
    <h2>2. 행사 정보</h2>
    <div class="row">
      <div><label>행사명</label><input id="evTitle" value="신인감독 김연경2 직관"></div>
      <div><label>장소</label><input id="evVenue" value="잠실학생체육관"></div>
    </div>
    <div class="row">
      <div><label>날짜 표기</label><input id="evDateLabel" value="2026. 8. 20 (목)"></div>
      <div><label>확인증 만료일 (YYYY-MM-DD)</label><input id="evExpires" value="2026-08-21"></div>
    </div>
    <button id="btnEvent" class="sub">행사 정보만 저장</button>
    <div class="out" id="outEvent"></div>
  </div>

  <div class="sec">
    <h2>3. 초청 명단 업로드 <span style="color:var(--orange)">(기존 명단 전체 교체)</span></h2>
    <p class="help">
      엑셀에서 5개 열을 그대로 복사해 붙여넣으세요 (탭/쉼표 모두 인식, 헤더 행 있어도 됨).<br>
      열 순서: <code>이름</code> <code>전화번호</code> <code>구역</code> <code>열</code> <code>번호</code> — 한 사람이 여러 좌석이면 좌석 수만큼 행 추가.<br>
      전화번호는 전체를 넣어도 <b>뒤 4자리만</b> 저장에 사용되며, 서버에서 <b>암호화 후</b> 저장됩니다.
    </p>
    <textarea id="csv" placeholder="황민영	010-1234-5678	203	3	4
황민영	010-1234-5678	203	3	5
홍길동	010-9876-5432	101	1	12"></textarea>
    <button id="btnUpload" class="warn">명단 업로드 (전체 교체)</button>
    <div class="out" id="outUpload"></div>
  </div>

  <div class="sec">
    <h2>4. 관리자 키 변경</h2>
    <input id="newKey" type="text" placeholder="새 키 (10자 이상)">
    <button id="btnSetKey" class="sub">키 변경</button>
    <div class="out" id="outKey"></div>
  </div>
</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  function api(body){return fetch('/api/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json()})}
  function show(id,ok,msg){var el=$(id);el.className='out '+(ok?'ok':'bad');el.textContent=msg}
  function evObj(){return{title:$('evTitle').value,venue:$('evVenue').value,dateLabel:$('evDateLabel').value,expires:$('evExpires').value,date:($('evExpires').value||'').slice(0,10)}}
  function busy(btn,on,txt){btn.disabled=on;btn.dataset.t=btn.dataset.t||btn.textContent;btn.textContent=on?'처리 중…':(txt||btn.dataset.t)}

  $('btnStatus').onclick=function(){
    var b=this;busy(b,true);
    api({action:'admin',key:$('key').value,op:'status'}).then(function(d){
      if(d.ok){
        $('stat').innerHTML='<span>등록 인원 <b>'+d.people+'</b>명</span><span>마지막 업데이트 <b>'+(d.updatedAt?d.updatedAt.replace('T',' ').slice(0,16)+' UTC':'-')+'</b></span>';
        if(d.event){ if(d.event.title)$('evTitle').value=d.event.title; if(d.event.venue)$('evVenue').value=d.event.venue;
          if(d.event.dateLabel)$('evDateLabel').value=d.event.dateLabel; if(d.event.expires)$('evExpires').value=d.event.expires; }
        show('outStatus',true,'현황을 불러와습니다.');
      }else show('outStatus',false,d.msg||d.error||'실패');
    }).catch(function(){show('outStatus',false,'네트워크 오류')}).finally(function(){busy(b,false)});
  };

  $('btnEvent').onclick=function(){
    var b=this;busy(b,true);
    api({action:'admin',key:$('key').value,op:'event',event:evObj()}).then(function(d){
      show('outEvent',!!d.ok,d.ok?'저장되었습니다. (즉시 반영)':(d.msg||d.error||'실패'));
    }).catch(function(){show('outEvent',false,'네트워크 오류')}).finally(function(){busy(b,false)});
  };

  $('btnUpload').onclick=function(){
    var text=$('csv').value.trim();
    if(!text){show('outUpload',false,'명단을 붙여넣어 주세요.');return}
    if(!confirm('기존 명단을 전체 교체합니다. 진행할까요?'))return;
    var b=this;busy(b,true);
    api({action:'admin',key:$('key').value,op:'upload',csvText:text,event:evObj()}).then(function(d){
      if(d.ok){
        var msg='업로드 완료: '+d.people+'명 · '+d.seats+'석';
        if(d.warnings&&d.warnings.length)msg+='\n\n[건너뛴 행 '+d.warnings.length+'건]\n'+d.warnings.join('\n');
        show('outUpload',true,msg);
      }else show('outUpload',false,(d.msg||d.error||'실패')+(d.warnings?'\n'+d.warnings.join('\n'):''));
    }).catch(function(){show('outUpload',false,'네트워크 오류')}).finally(function(){busy(b,false)});
  };

  $('btnSetKey').onclick=function(){
    var nk=$('newKey').value;
    if(nk.length<10){show('outKey',false,'새 키는 10자 이상이어야 합니다.');return}
    if(!confirm('관리자 키를 변경합니다. 새 키를 반드시 별도 보관하세요.'))return;
    var b=this;busy(b,true);
    api({action:'admin',key:$('key').value,op:'setkey',newKey:nk}).then(function(d){
      if(d.ok){show('outKey',true,'키가 변경되었습니다. 지금부터 새 키를 사용하세요.');$('key').value=nk;$('newKey').value=''}
      else show('outKey',false,d.msg||d.error||'실패');
    }).catch(function(){show('outKey',false,'네트워크 오류')}).finally(function(){busy(b,false)});
  };
})();
</script>
</body>
</html>
