<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>좌석 배정 · 장충체육관</title>
<style>
:root{--bg:#12171D;--panel:#1A2129;--line:#2B3540;--ink:#EAF0F6;--mute:#AEBAC6;--faint:#77848F;
--maple:#FFC61A;--ok:#40C057;--warn:#F2C744;--bad:#E24A4A;--sel:#4DABF7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:19px;margin:4px 0 2px}
h1 small{font-size:12px;color:var(--faint);font-weight:600;margin-left:8px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
a.lnk{color:var(--mute);font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.badge{font-size:11.5px;color:var(--faint)}
.badge.on{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:#4A5866}
.btn.acc{background:#2A3A2C;border-color:#3E5F42}
.btn.warn{background:#3A2B2B;border-color:#6E3B3B}
.btn:disabled{opacity:.45;cursor:default}
.cnt{font-size:12.5px;color:var(--mute);margin-left:auto}
.cnt b{color:var(--maple)}
.main{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.ztabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ztab{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
.ztab.on{border-color:var(--maple);color:var(--maple);font-weight:700}
.ztab i{font-style:normal;color:var(--faint);font-size:10.5px;margin-left:4px}
.ztab.full i{color:var(--ok)}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#141A21}
.zhead{font-size:12.5px;color:var(--mute);margin:0 0 8px}
.row{display:flex;gap:3px;margin-bottom:3px;align-items:center}
.rl{width:74px;min-width:74px;font-size:10.5px;color:var(--faint);text-align:right;padding-right:6px}
.seat{width:60px;height:42px;min-width:60px;border-radius:6px;border:1px solid #33404C;background:#20303E;
  font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#9DB4C8;cursor:default;
  overflow:hidden;white-space:nowrap;user-select:none;position:relative;line-height:1.18;padding:1px 3px}
.seat .rp{font-size:8.5px;font-weight:600;opacity:.72;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.seat .nm2{font-size:11.5px;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.seat.gap{visibility:hidden}
.seat.o{cursor:pointer}
.seat.y{background:#3A3418;border-color:#5C511F;color:#D8C25A}
.seat.x{background:#2A1D1D;border-color:#4A2B2B;color:#7A5252;cursor:not-allowed}
.seat.c{background:#1C2E40;border-color:#2E4B66;color:#5E88AC;cursor:not-allowed}
.seat.blk{box-shadow:inset 0 0 0 2px var(--bcol,transparent)}
.seat.asg{background:#213326;border-color:#3E5F42;color:#D9F2DC;cursor:grab}
.seat.asg.y{background:#3A3418;color:#F2E4A0}
.seat.hov{outline:2px solid var(--sel)}
.seat.selp{outline:2px solid var(--maple)}
.seat.flash{outline:3px solid var(--maple);box-shadow:0 0 0 5px rgba(255,198,26,.28)}
.courtline{margin:6px 0;padding:6px 10px;border-radius:8px;background:linear-gradient(90deg,#3A2E12,#54421A,#3A2E12);color:#FFC61A;font-size:12px;font-weight:800;letter-spacing:.14em;text-align:center;border:1px solid #6B5620}
.rl i{display:block;font-style:normal;color:#FFC61A;font-size:9.5px;font-weight:800}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--faint);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.side h3{font-size:13.5px;margin:2px 0 8px}
.side h3 b{color:var(--maple)}
.chips{display:flex;flex-direction:column;gap:5px;overflow-y:auto;overflow-x:hidden;
  max-height:calc(100vh - 320px);min-height:220px;padding-right:2px}
#q{width:100%;background:#12171D;border:1px solid var(--line);color:var(--ink);border-radius:8px;
  padding:7px 10px;font:inherit;font-size:12.5px;margin:0 0 8px}
#q::placeholder{color:var(--faint)}
#qcnt{font-size:11px;color:var(--faint);margin:-4px 0 6px;display:none}
.ghead{font-size:11.5px;color:var(--faint);margin:7px 0 1px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#141A21;border-radius:8px;
  padding:5px 8px;font-size:12.5px;cursor:grab}
.chip.selp{border-color:var(--maple);box-shadow:0 0 0 1px var(--maple)}
.chip .nm{font-weight:700}
.chip .tags{margin-left:auto;display:flex;gap:3px}
.tg{font-size:9.5px;border-radius:4px;padding:1px 4px;background:#2A3540;color:var(--mute)}
.tg.vip{background:#4A3413;color:#FFC61A}.tg.con{background:#1C3A44;color:#5BD0E8}.tg.y{background:#3A3418;color:#D8C25A}
.chip .ed{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;padding:0 2px}
#editbox{position:fixed;z-index:30;background:#1E2732;border:1px solid #3A4856;border-radius:12px;padding:12px;width:270px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);display:none}
#editbox label{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:5px 0;color:var(--mute)}
#editbox input[type=text]{flex:1;background:#12171D;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 7px;font:inherit;font-size:12.5px}
#editbox select{background:#12171D;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px;font:inherit;font-size:12.5px}
#warnbox{margin-top:10px;font-size:12px;color:#F0B4B4;white-space:pre-wrap;display:none;border:1px solid #5A3232;border-radius:9px;padding:8px 10px;background:#241A1A}
#tip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0E1A24;border:1px solid #2E4B66;
  color:#CFE6F8;padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#tip.on{opacity:1}
.btn.sm{padding:3px 9px;font-size:11.5px;border-radius:7px}
.btn.sm.on{border-color:var(--maple);color:var(--maple)}
#selbar{display:none;margin:0 0 8px;padding:7px 9px;border:1px solid #5C511F;background:#2A2612;border-radius:9px;font-size:12px;color:#E8D98A}
#selbar .btn{padding:3px 8px;font-size:11px;margin-left:5px}
.ztab.hov{outline:2px solid var(--sel)}
#mini g.hov path{stroke:#4DABF7;stroke-width:2.4}
.bks{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 10px}
.bk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:11.5px;color:var(--mute)}
.bk i{width:9px;height:9px;border-radius:3px;display:inline-block}
.bk b{color:var(--ink)}
.bk .rm{color:var(--maple)}
.parthead{font-size:12.5px;color:var(--ink);font-weight:700;margin:12px 0 4px}
.parthead small{color:var(--faint);font-weight:600;margin-left:6px}
.colhead{display:flex;gap:3px;margin:0 0 3px}
.colhead span{width:60px;min-width:60px;text-align:center;font-size:9.5px;color:var(--faint)}
.courtbar{width:38px;border-radius:8px;background:linear-gradient(#2C6E80,#2C6E80) padding-box;border:1px solid #3A7E92;
  display:flex;align-items:center;justify-content:center;color:#CFEFF9;font-weight:800;font-size:12px;
  writing-mode:vertical-rl;letter-spacing:6px;align-self:stretch}
#mini{margin-top:12px}
#mini svg{width:100%;max-width:600px;display:block;background:#141A21;border:1px solid var(--line);border-radius:10px}
#mini .mz{cursor:pointer}
#mini .mz:hover path{stroke:#8FB4D6}

</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>좌석 배정<small>장충체육관 · 8/27 신인감독 김연경2</small></h1>
    <span class="badge" id="sync">불러오는 중…</span>
    <span class="sp"></span>
    <a class="lnk" href="index.html">← 좌석 배치도(사석·블록)</a>
  </div>

  <div class="bar">
    <button class="btn" id="btnUp">① 명단 엑셀 업로드</button>
    <input type="file" id="file" accept=".xlsx,.xls" style="display:none">
    <button class="btn" id="btnTpl">양식 받기</button>
    <button class="btn acc" id="btnAuto">② 자동 배정</button>
    <button class="btn" id="btnXls">③ 배정결과 엑셀</button>
    <button class="btn" id="btnKyk">③ kyk2 명단 엑셀</button>
    <button class="btn warn" id="btnClr">배정 전체 해제</button>
    <button class="btn" id="btnUndo" disabled>↶ 되돌리기</button>
    <button class="btn" id="btnRedo" disabled>↷ 다시하기</button>
    <label style="display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);border:1px dashed var(--line);border-radius:9px;padding:6px 10px">
      <input type="checkbox" id="okFree"> 자유석 배정 허용 <span style="color:var(--faint);font-size:10.5px">(끄면 대분류 블록에만)</span></label>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="main">
    <div class="panel">
      <div class="bks" id="blkstats"></div>
      <div class="ztabs" id="fltabs"></div>
      <div class="ztabs" id="ztabs"></div>
      <div class="gridwrap" id="grid"></div>
      <div class="legend">
        <span><i style="background:#20303E;border:1px solid #33404C"></i>빈 좌석(번호)</span>
        <span><i style="background:#213326;border:1px solid #3E5F42"></i>배정됨(이름)</span>
        <span><i style="background:#3A3418"></i>시야제한석</span>
        <span><i style="background:#2A1D1D"></i>사석</span>
        <span><i style="background:#1C2E40"></i>카메라</span>
        <span>테두리색 = 팀 지정블록</span>
      </div>
      <div id="mini"></div>
      <div id="warnbox"></div>
    </div>
    <div class="panel side">
      <h3 style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">미배정 <b id="left">0</b>명
        <button class="btn sm" id="btnAdd">＋ 추가</button>
        <button class="btn sm" id="btnMsel" title="켜면 클릭만으로 여러 명 선택">다중선택</button>
      </h3>
      <div style="font-size:11px;color:var(--faint);margin:-4px 0 8px">드래그: 좌석·구역 탭·아래 지도에 놓으면 이동 · Ctrl+클릭 = 여러 명 선택 · Ctrl+Z 되돌리기</div>
      <div id="selbar"></div>
      <input type="search" id="q" placeholder="이름 · 팀 · 대표자 검색">
      <div id="qcnt"></div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</div>

<div id="editbox"></div>
<div id="tip"></div>
<script src="assets/xlsx.full.min.js?v=260823o"></script>
<script src="assets/assign-core.js?v=260823o"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
let M=null, VENJC=null;                       /* 좌석 모델 */
let A={roster:[],order:[],seats:{},updatedAt:0};   /* 배정 상태(공유 저장) */
let CURFL='1층', CURZ=null;
const COMBO={KLN1:['K1','L1','N1']};                 /* 한 파트로 묶어 보는 구역 */
const IN_COMBO={K1:'KLN1',L1:'KLN1',N1:'KLN1'};
function dispZones(fl){
  const out=[]; M.floors[fl].forEach(zid=>{
    const cb=IN_COMBO[zid];
    if(cb){ if(out.indexOf(cb)<0) out.push(cb); } else out.push(zid);
  }); return out;
}
function zidsOf(dz){ return COMBO[dz]||[dz]; }
let STATE=null, shared=false, lastLocal=0, pushT=null;
const LSKEY='jc-assign-v1';
const teamCol={}; /* 팀 지정블록 색 */

function tip(m){const t=$('#tip');t.textContent=m;t.classList.add('on');clearTimeout(tip._t);tip._t=setTimeout(()=>t.classList.remove('on'),2400);}
function badge(m,ok){const b=$('#sync');b.textContent=m;b.className='badge'+(ok?' on':'');}

/* ── 부팅: index.html에서 도면 추출 + 공유 상태 ── */
async function boot(){
  try{
    const html=await (await fetch('index.html',{cache:'no-store'})).text();
    const mm=html.match(/const VEN=(\{[\s\S]*?\});<\/script>/);
    VENJC=JSON.parse(mm[1]).jc;
  }catch(e){ badge('도면(index.html)을 읽지 못했습니다',false); return; }
  let rsv=VENJC.rsv;
  try{
    const r=await fetch('api/state',{cache:'no-store'});
    if(r.ok){ STATE=await r.json(); shared=true;
      const jc=(STATE&&STATE.venues&&STATE.venues.jc)||{};
      if(jc.rsv&&jc.rsv.length) rsv=jc.rsv;
      if(jc.assign) A=jc.assign;
      badge('공유 저장소 연결됨 — 모두 같은 배정을 봅니다',true);
    } else throw 0;
  }catch(e){
    shared=false;
    try{const raw=localStorage.getItem(LSKEY); if(raw) A=JSON.parse(raw);}catch(x){}
    badge('공유 저장소 없음 — 이 기기 브라우저에만 저장됩니다',false);
  }
  (VENJC.teams||[]).forEach(t=>teamCol[t.name]=t.col);
  (rsv||[]).forEach(e=>{ if(e.note&&e.col) teamCol[e.note]=e.col; });
  M=AssignCore.buildModel(VENJC, rsv);
  A.roster=A.roster||[]; A.order=A.order||A.roster.map(p=>p.id); A.seats=A.seats||{};
  CURZ=dispZones('1층')[0];
  const of=$('#okFree'); if(of){of.checked=!!A.allowFree; of.onchange=()=>{A.allowFree=of.checked;save();};}
  renderAll();
  if(shared) setInterval(poll,15000);
}
async function poll(){
  if(DRAG.length||SEL.size||Date.now()-lastLocal<10000) return;
  try{const r=await fetch('api/state',{cache:'no-store'}); if(!r.ok)return;
    const o=await r.json(); const jc=o&&o.venues&&o.venues.jc;
    if(jc&&jc.assign&&jc.assign.updatedAt>(A.updatedAt||0)){ STATE=o; A=jc.assign; renderAll(); }
  }catch(e){}
}
function save(){
  A.updatedAt=Date.now(); lastLocal=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(A));}catch(e){}
  if(!shared){ badge('이 기기 브라우저에 저장됨',false); return; }
  badge('저장 중…',true);
  clearTimeout(pushT); pushT=setTimeout(async()=>{
    try{
      const r0=await fetch('api/state',{cache:'no-store'});
      let o=r0.ok? await r0.json() : null;
      if(!o||typeof o!=='object') o={ver:1,rev:20260825,venues:{}};
      o.venues=o.venues||{}; o.venues.jc=o.venues.jc||{};
      o.venues.jc.assign=A; o.updatedAt=Date.now(); o.rev=Math.max(o.rev||0,20260825);
      const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
      if(r.ok){const d=new Date();badge('공유 저장소에 저장됨 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),true);}
      else badge('공유 저장 실패('+r.status+') — 이 기기에만 저장됨',false);
    }catch(e){badge('공유 저장 실패 — 이 기기에만 저장됨',false);}
  },1500);
}

/* ── 렌더 ── */
const pidOnSeat={};
function rebuildSeatIdx(){ for(const k in pidOnSeat)delete pidOnSeat[k]; for(const pid in A.seats)pidOnSeat[A.seats[pid]]=pid; }
function byId(id){ return A.roster.find(p=>p.id===id); }
function renderAll(){ rebuildSeatIdx(); renderTabs(); renderGrid(); renderChips(); renderCnt(); renderBlk(); renderMini(); renderSelbar(); }
function renderTabs(){
  $('#fltabs').innerHTML=['1층','2층'].map(f=>'<button class="ztab'+(f===CURFL?' on':'')+'" data-fl="'+f+'">'+f+'</button>').join('');
  $('#ztabs').innerHTML=dispZones(CURFL).map(dz=>{
    let tot=0,asg=0;
    zidsOf(dz).forEach(zid=>{const zone=M.byZone[zid];
      tot+=zone.seats.filter(s=>s.b==='o'||s.b==='y').length;
      asg+=zone.seats.filter(s=>pidOnSeat[s.key]).length;});
    const nm=COMBO[dz]?zidsOf(dz).join('·'):dz;
    return '<button class="ztab'+(dz===CURZ?' on':'')+(asg&&asg>=tot?' full':'')+'" data-z="'+dz+'">'+nm+'<i>'+asg+'/'+tot+'</i></button>';
  }).join('');
}
function seatCell(s){
  const pid=pidOnSeat[s.key], p=pid&&byId(pid);
  const own=M.owner[s.key];
  let cls='seat '+s.b+(p?' asg':'')+(own?' blk':'')+(pid&&SEL.has(pid)?' selp':'');
  let sty=own?' style="--bcol:'+(teamCol[own]||'#556')+'"':'';
  let label;
  if(p){ const rp=p.rep||p.team;
    label=(rp?'<span class="rp">('+esc(rp)+')</span>':'')+'<span class="nm2">'+esc(p.name)+'</span>';
  } else label=(s.b==='x'?'사석':(s.b==='c'?'카메라':String(s.n)));
  const tt=s.zid+' '+s.n+'번'+(s.b==='y'?' · 시야제한':'')+(own?' · '+own+' 블록':'')+(p?' · '+p.team+' '+(p.rep||'')+' '+p.name:'');
  return '<span class="'+cls+'"'+sty+' data-k="'+s.key+'" title="'+tt+'"'+(p?' draggable="true"':'')+'>'+label+'</span>';
}
/* index(메인 화면) 상세와 동일한 표시 규칙:
   아래쪽 구역(sec a>180 또는 face N) → 코트가 위, 1열이 맨 윗줄, 좌우 반전
   그 외 → 코트가 아래, 1열이 맨 아랫줄, 1번 좌석 왼쪽 */
function vzOf(id){ return (VENJC.zones||[]).find(z=>z.id===id)||{}; }
function flipUp(vz){ return !!(vz.geo&&(vz.geo.k==='sec'? vz.geo.a>180 : vz.face==='N')); }
function zoneBlockHTML(zid, opts){
  opts=opts||{};
  const zone=M.byZone[zid], vz=vzOf(zid), up=flipUp(vz), flip=!!vz.flip;
  const cell={}; zone.seats.forEach(s=>cell[s.r+'_'+s.c]=s);
  const colAt=dj=>{ if(up){const c0=zone.nC-1-dj; return flip? zone.nC-1-c0 : c0;} return flip? zone.nC-1-dj : dj; };
  let h='';
  if(up&&!opts.noCourt) h+='<div class="courtline">▲ 코트 방향 · 1열이 맨 위</div>';
  for(let di=0;di<zone.nR;di++){
    const r= up? di : zone.nR-1-di;
    h+='<div class="row"><span class="rl">'+(r+1)+'열'+(r===0?'<i>코트쪽</i>':'')+'</span>';
    for(let dj=0;dj<zone.nC;dj++){
      const st=cell[r+'_'+colAt(dj)];
      h+= st? seatCell(st) : '<span class="seat gap"></span>';
    }
    h+='</div>';
  }
  if(!up&&!opts.noCourt) h+='<div class="courtline">▼ 코트 방향 · 1열이 맨 아래</div>';
  return h;
}
function renderKLN(){
  let h='<div class="zhead"><b>K1 · L1 · N1</b> 한 파트 보기 · 메인 화면 도면과 같은 방향(1열이 코트쪽 아랫줄)</div>';
  zidsOf('KLN1').forEach(zid=>{
    const zone=M.byZone[zid];

/* 아래 전체 코트 지도(미니맵): 구역 클릭으로 이동, 채움 정도 표시 */
function renderMini(){
  const E=VENJC.extras, CC=E.cx, CCY=E.cy;
  const rp=(r,a)=>[CC+r*Math.cos(a*Math.PI/180), CCY-r*Math.sin(a*Math.PI/180)];
  const arc=(rr,a,sp)=>{const g=0.5,ri=rr[0],ro=rr[1],a0=a-sp/2+g,a1=a+sp/2-g,N=Math.max(6,Math.round(sp/3)),pt=[];
    for(let i=0;i<=N;i++)pt.push(rp(ro,a0+(a1-a0)*i/N));
    for(let i=N;i>=0;i--)pt.push(rp(ri,a0+(a1-a0)*i/N));
    return 'M'+pt.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L')+'Z';};
  let sv='<svg viewBox="0 0 '+E.vw+' '+E.vh+'" role="img" aria-label="전체 좌석 현황 지도">';
  (E.ring||[]).forEach(r=>{sv+='<circle cx="'+CC+'" cy="'+CCY+'" r="'+r.r+'" fill="none" stroke="'+r.s+'" stroke-width="'+r.w+'" opacity=".5"/>';});
  const ct=E.court; if(ct){sv+='<rect x="'+(ct.x-12)+'" y="'+(ct.y-12)+'" width="'+(ct.w+24)+'" height="'+(ct.h+24)+'" rx="4" fill="#2C6E80"/>'
    +'<rect x="'+ct.x+'" y="'+ct.y+'" width="'+ct.w+'" height="'+ct.h+'" fill="#E8973F" stroke="#F4F7F9" stroke-width="2"/>'
    +'<line x1="'+(ct.x+ct.w/2)+'" y1="'+(ct.y-12)+'" x2="'+(ct.x+ct.w/2)+'" y2="'+(ct.y+ct.h+12)+'" stroke="#F4F7F9" stroke-width="2"/>'
    +'<text x="'+(ct.x+ct.w/2)+'" y="'+(ct.y+ct.h/2+5)+'" text-anchor="middle" font-size="15" font-weight="800" fill="#7A4A16">코트</text>';}
  M.zones.forEach(z0=>{
    const z=VENJC.zones.find(v=>v.id===z0.id);
    let d,px,py;
    if(z.geo.k==='box'){
      const[x,y,w,hh]=z.geo.v; px=x+w/2; py=y+hh/2;
      const rot=z.geo.rot||0;
      if(rot){const RA=rot*Math.PI/180,RC=Math.cos(RA),RS=Math.sin(RA);
        const cs=[[x,y],[x+w,y],[x+w,y+hh],[x,y+hh]].map(q=>{const dx=q[0]-px,dy=q[1]-py;return[(px+dx*RC-dy*RS).toFixed(1),(py+dx*RS+dy*RC).toFixed(1)];});
        d='M'+cs.map(q=>q[0]+' '+q[1]).join('L')+'Z';}
      else d='M'+x+' '+y+'h'+w+'v'+hh+'h'+(-w)+'Z';
    }else{
      d=arc(z.geo.rr,z.geo.a,z.geo.sp);
      const q=rp((z.geo.rr[0]+z.geo.rr[1])/2,z.geo.a); px=q[0]; py=q[1];
    }
    const tot=z0.seats.filter(x=>x.b==='o'||x.b==='y').length;
    const asg=z0.seats.filter(x=>pidOnSeat[x.key]).length;
    const prog=tot?asg/tot:0;
    const fill=tot? 'rgb('+Math.round(38+prog*10)+','+Math.round(49+prog*110)+','+Math.round(60+prog*20)+')' : '#232B33';
    const dz=IN_COMBO[z0.id]||z0.id;
    const cur=(CURZ===dz);
    sv+='<g class="mz" data-mz="'+dz+'"><path d="'+d+'" fill="'+fill+'" stroke="'+(cur?'#FFC61A':'#3A4855')+'" stroke-width="'+(cur?2.4:1)+'"/>'
      +'<text x="'+px.toFixed(1)+'" y="'+(py-1).toFixed(1)+'" text-anchor="middle" font-size="12" font-weight="800" fill="#DFE9F2">'+z0.id+'</text>'
      +(tot?'<text x="'+px.toFixed(1)+'" y="'+(py+12).toFixed(1)+'" text-anchor="middle" font-size="9.5" fill="#9FB2C2">'+asg+'/'+tot+'</text>':'')+'</g>';
  });
  sv+='</svg>';
  $('#mini').innerHTML=sv;
}

/* ── 배정 조작 · 선택 · 되돌리기 ── */
const UNDO=[],REDO=[]; let SEL=new Set(), MSEL=false;
function snap(){return JSON.stringify({roster:A.roster,order:A.order,seats:A.seats});}
function restore(j){const o=JSON.parse(j);A.roster=o.roster;A.order=o.order;A.seats=o.seats;}
function updUR(){$('#btnUndo').disabled=!UNDO.length;$('#btnRedo').disabled=!REDO.length;}
function pushUndo(){UNDO.push(snap());if(UNDO.length>60)UNDO.shift();REDO.length=0;updUR();}
function doUndo(){if(!UNDO.length)return;REDO.push(snap());restore(UNDO.pop());SEL.clear();save();renderAll();updUR();tip('되돌렸습니다');}
function doRedo(){if(!REDO.length)return;UNDO.push(snap());restore(REDO.pop());SEL.clear();save();renderAll();updUR();tip('다시 실행');}
$('#btnUndo').onclick=doUndo; $('#btnRedo').onclick=doRedo;
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&!e.altKey&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?doRedo():doUndo();}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'){e.preventDefault();doRedo();}
  if(e.key==='Escape'){SEL.clear();renderAll();}
});
function selOrdered(){return A.order.filter(id=>SEL.has(id));}
function toggleSel(pid,add){
  if(add){SEL.has(pid)?SEL.delete(pid):SEL.add(pid);}
  else{ if(SEL.size===1&&SEL.has(pid))SEL.clear(); else{SEL.clear();SEL.add(pid);} }
  renderAll();
}
function seatJump(pid){
  const key=A.seats[pid]; if(!key)return;
  const st=M.seatsByKey[key], dz=IN_COMBO[st.zid]||st.zid;
  CURFL=(M.byZone[st.zid].fl==='L')?'1층':'2층'; CURZ=dz;
  SEL.clear(); SEL.add(pid); renderAll();
  const el=document.querySelector('.seat[data-k="'+key+'"]');
  if(el){ el.classList.add('flash'); el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'});
    setTimeout(()=>el.classList.remove('flash'),2500); }
  tip(byId(pid).name+' — '+st.zid+' 구역 '+st.n+'번');
}
function renderSelbar(){
  const n=SEL.size,b=$('#selbar'); if(!b)return;
  if(!n){b.style.display='none';b.innerHTML='';return;}
  b.style.display='block';
  b.innerHTML='<b>'+n+'명 선택</b> — 좌석·구역 탭·지도에 드래그(또는 빈 좌석 클릭)하면 함께 이동'
   +'<button class="btn" id="selUn">배정 해제</button><button class="btn" id="selDel">삭제</button><button class="btn" id="selX">선택 해제</button>';
}
function personAllowed(p,st,takenMap){
  if(takenMap[st.key])return false;
  if(st.b==='x'||st.b==='c')return false;
  if(st.b==='y'&&!p.okY)return false;
  const own=M.owner[st.key]; if(own&&!AssignCore.teamMatchesBlock(p.team,own))return false;
  return true;
}
function place(pid,key){
  const p=byId(pid), st=M.seatsByKey[key]; if(!p||!st)return;
  if(st.b==='x'||st.b==='c'){tip('사석·카메라석에는 배정할 수 없습니다');return;}
  if(st.b==='y'&&!p.okY){tip(p.name+'님은 시야제한석 불가 설정입니다 — ✎ 옵션에서 허용으로 바꾸면 가능');return;}
  const own=M.owner[key]; if(own&&!AssignCore.teamMatchesBlock(p.team,own)){tip('이 좌석은 '+own+' 지정블록입니다');return;}
  pushUndo();
  const occ=pidOnSeat[key], prev=A.seats[pid];
  if(occ&&occ!==pid){ if(prev){A.seats[occ]=prev;} else {delete A.seats[occ];} }
  A.seats[pid]=key;
  SEL.clear(); save(); renderAll();
}
function unplace(pid){ if(A.seats[pid]){pushUndo();delete A.seats[pid];save();renderAll();} }
/* 여러 명: 지정 좌석부터 이어 앉히기 */
function groupPlaceAt(pids,anchorKey){
  const anchor=M.seatsByKey[anchorKey]; if(!anchor)return;
  pushUndo();
  const zone=M.byZone[anchor.zid];
  const taken={}; for(const id in A.seats){ if(pids.indexOf(id)<0) taken[A.seats[id]]=id; }
  pids.forEach(id=>{delete A.seats[id];});
  const rows={}; zone.seats.forEach(x=>{(rows[x.r]=rows[x.r]||[]).push(x);});
  Object.values(rows).forEach(a=>a.sort((x,y)=>x.c-y.c));
  const seq=[];
  (rows[anchor.r]||[]).forEach(x=>{if(x.c>=anchor.c)seq.push(x);});
  for(let r=anchor.r+1;r<zone.nR;r++)(rows[r]||[]).forEach(x=>seq.push(x));
  for(let r=anchor.r-1;r>=0;r--)(rows[r]||[]).forEach(x=>seq.push(x));
  (rows[anchor.r]||[]).forEach(x=>{if(x.c<anchor.c)seq.push(x);});
  let miss=0,si=0;
  pids.forEach(id=>{
    const p=byId(id); if(!p){miss++;return;}
    while(si<seq.length&&!personAllowed(p,seq[si],taken))si++;
    if(si<seq.length){A.seats[id]=seq[si].key;taken[seq[si].key]=id;si++;}
    else miss++;
  });
  SEL.clear(); save(); renderAll();
  tip(miss? miss+'명은 이 구역에 자리가 부족해 미배정으로 남았습니다':'그룹 이동 완료 ('+pids.length+'명)');
}
/* 여러 명: 다른 구역으로 통째 이동(연석 로직 재사용) */
function groupMoveToZone(pids,dz){
  const zids=zidsOf(dz);
  pushUndo();
  const ps=pids.map(byId).filter(Boolean);
  const uniform=ps.length&&ps.every(p=>p.team===ps[0].team);
  const clones=ps.map(p=>Object.assign({},p,{team:uniform?p.team:'',rep:'__그룹__',con:true,vip:false,fl:'',zones:zids}));
  const others={}; for(const id in A.seats){ if(pids.indexOf(id)<0) others[id]=A.seats[id]; }
  const seats0={}; for(const id in others)seats0[id]=others[id];
  const prev={}; pids.forEach(id=>{prev[id]=A.seats[id];});
  const res=AssignCore.autoAssign(M,clones,pids.slice(),seats0,{allowFree:$('#okFree').checked,pin:true});
  pids.forEach(id=>{delete A.seats[id];});
  let done=0;
  pids.forEach(id=>{ if(res.seatOf[id]){A.seats[id]=res.seatOf[id];done++;} });
  if(done===0){                                     /* 그 구역에 함께 못 앉으면 이동 취소(원위치) */
    pids.forEach(id=>{ if(prev[id])A.seats[id]=prev[id]; });
    SEL.clear(); renderAll();
    tip(dz+' 구역에 '+pids.length+'명이 붙어 앉을 자리가 없어 이동하지 않았습니다');
    UNDO.pop(); updUR();
    return;
  }
  SEL.clear(); save(); renderAll();
  tip(dz+'(으)로 '+done+'명 함께 이동');
}
/* 클릭: 선택 → 배정/이동 */
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-ed]'); if(ed){openEdit(ed.dataset.ed,e);return;}
  if(e.target.closest('#btnAdd')){openAdd(e);return;}
  if(e.target.closest('#btnMsel')){MSEL=!MSEL;$('#btnMsel').classList.toggle('on',MSEL);tip(MSEL?'다중선택 모드: 클릭할 때마다 선택에 추가됩니다':'다중선택 해제');return;}
  if(e.target.closest('#selX')){SEL.clear();renderAll();return;}
  if(e.target.closest('#selUn')){const ids=selOrdered().filter(id=>A.seats[id]); if(ids.length){pushUndo();ids.forEach(id=>delete A.seats[id]);} SEL.clear();save();renderAll();return;}
  if(e.target.closest('#selDel')){const ids=selOrdered(); if(!ids.length)return;
    if(!confirm(ids.length+'명을 명단에서 삭제할까요?'))return;
    pushUndo(); ids.forEach(id=>{delete A.seats[id];}); A.roster=A.roster.filter(p=>ids.indexOf(p.id)<0); A.order=A.order.filter(id=>ids.indexOf(id)<0);
    SEL.clear();save();renderAll();return;}
  const mz=e.target.closest('[data-mz]');
  if(mz){
    if(SEL.size){groupMoveToZone(selOrdered(),mz.dataset.mz);return;}
    const dz=mz.dataset.mz, first=zidsOf(dz)[0];
    CURFL=(M.byZone[first].fl==='L')?'1층':'2층'; CURZ=dz; renderAll(); return;
  }
  const chip=e.target.closest('.chip');
  if(chip){ if(chip.dataset.asg){seatJump(chip.dataset.p);return;} toggleSel(chip.dataset.p,e.ctrlKey||e.metaKey||MSEL);return;}
  const st=e.target.closest('.seat[data-k]');
  if(st){
    const key=st.dataset.k, occ=pidOnSeat[key];
    if(occ&&(e.ctrlKey||e.metaKey||MSEL)){toggleSel(occ,true);return;}
    if(SEL.size>1){groupPlaceAt(selOrdered(),key);return;}
    if(SEL.size===1){place(selOrdered()[0],key);return;}
    if(occ){toggleSel(occ,false);tip(byId(occ).name+' 선택됨 — 옮길 좌석을 클릭 (Ctrl+클릭으로 여러 명 선택)');}
    return;
  }
  if(!e.target.closest('#editbox')) closeEdit();
});

  if(!DRAG.length)return;
  const pids=DRAG.slice(); DRAG=[];
  const st=e.target.closest('.seat[data-k]');

    if(from>=0&&to>=0){pushUndo();A.order.splice(from,1);A.order.splice(to,0,pids[0]);save();renderChips();}
    return;
  }
  if(e.target.closest('.side')){ const ids=pids.filter(id=>A.seats[id]); if(ids.length){pushUndo();ids.forEach(id=>delete A.seats[id]);save();} SEL.clear(); renderAll(); }

document.addEventListener('input',e=>{ if(e.target.id==='q'){Q=e.target.value; renderChips();} });
/* 탭 */
$('#fltabs').addEventListener('click',e=>{const b=e.target.closest('[data-fl]');if(!b)return;CURFL=b.dataset.fl;CURZ=dispZones(CURFL)[0];renderAll();});
$('#ztabs').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;CURZ=b.dataset.z;renderTabs();renderGrid();});
/* 명단 직접 추가 */
function openAdd(e){
  const bx=$('#editbox');
  bx.innerHTML='<div style="font-weight:700;margin-bottom:4px">명단 추가</div>'
   +'<label>팀 <input type="text" id="a_t" placeholder="예: MBC"></label>'
   +'<label>대표자 <input type="text" id="a_r"></label>'
   +'<label>이름 <input type="text" id="a_n"></label>'
   +'<label>연락처 <input type="text" id="a_ph" placeholder="선택"></label>'
   +'<label>층수 <select id="a_fl"><option value="">무관</option><option>1층</option><option>2층</option></select>'
   +' 구역 <input type="text" id="a_z" style="width:90px" placeholder="H1,I1"></label>'
   +'<label><input type="checkbox" id="a_con" checked> 연석 <input type="checkbox" id="a_vip"> VIP <input type="checkbox" id="a_y"> 시야OK</label>'
   +'<div style="display:flex;gap:6px;margin-top:8px"><button class="btn acc" id="a_ok">추가</button><button class="btn" id="a_x">닫기</button></div>'
   +'<div style="font-size:10.5px;color:var(--faint);margin-top:5px">추가 후에도 창이 유지되어 같은 팀을 연달아 입력할 수 있습니다</div>';
  bx.style.display='block';
  const r=e.target.getBoundingClientRect();
  bx.style.left=Math.min(window.innerWidth-290,Math.max(8,r.left-120))+'px'; bx.style.top=Math.min(window.innerHeight-320,r.bottom+8)+'px';
  $('#a_ok').onclick=()=>{
    const nm=$('#a_n').value.trim(); if(!nm){tip('이름을 입력하세요');return;}
    pushUndo();
    const p=AssignCore.makePerson({'팀':$('#a_t').value,'대표자명':$('#a_r').value,'참석자 이름':nm,'연락처':$('#a_ph').value,
      '층수':$('#a_fl').value,'구역지정':$('#a_z').value,'연석여부':$('#a_con').checked?'O':'X',
      'VIP 여부':$('#a_vip').checked?'O':'X','시야제한석 가능':$('#a_y').checked?'O':'X'},M);
    A.roster.push(p); A.order.push(p.id);
    save(); renderAll(); $('#a_n').value=''; $('#a_n').focus(); tip(nm+' 추가됨');
  };
  $('#a_x').onclick=closeEdit;
}
/* ── 옵션 수정 ── */
function openEdit(pid,e){
  const p=byId(pid); if(!p)return;
  const bx=$('#editbox');
  bx.innerHTML='<div style="font-weight:700;margin-bottom:4px">'+esc(p.name)+' <span style="color:var(--faint);font-weight:400;font-size:11.5px">'+esc(p.team)+' · '+esc(p.rep)+'</span></div>'
   +'<label>층수 <select id="e_fl"><option value="">무관</option><option'+(p.fl==='1층'?' selected':'')+'>1층</option><option'+(p.fl==='2층'?' selected':'')+'>2층</option></select></label>'
   +'<label>구역 <input type="text" id="e_z" value="'+esc(p.zones.join(','))+'" placeholder="예: H1,I1 (빈칸=전체)"></label>'
   +'<label><input type="checkbox" id="e_con"'+(p.con?' checked':'')+'> 연석(붙어앉기)</label>'
   +'<label><input type="checkbox" id="e_vip"'+(p.vip?' checked':'')+'> VIP(앞자리)</label>'
   +'<label><input type="checkbox" id="e_y"'+(p.okY?' checked':'')+'> 시야제한석 가능</label>'
   +'<label><input type="checkbox" id="e_grp"> 같은 팀·대표자 전원에게 적용</label>'
   +'<div style="display:flex;gap:6px;margin-top:8px"><button class="btn acc" id="e_ok">저장</button><button class="btn warn" id="e_del">명단에서 삭제</button><button class="btn" id="e_x">닫기</button></div>';
  bx.style.display='block';
  const r=e.target.getBoundingClientRect();
  bx.style.left=Math.min(window.innerWidth-290,r.left-140)+'px'; bx.style.top=Math.min(window.innerHeight-260,r.bottom+8)+'px';
  $('#e_ok').onclick=()=>{
    pushUndo();
    const upd=q=>{q.fl=$('#e_fl').value;q.zones=AssignCore.parseZones($('#e_z').value,M);q.con=$('#e_con').checked;q.vip=$('#e_vip').checked;q.okY=$('#e_y').checked;};
    if($('#e_grp').checked) A.roster.filter(q=>q.team===p.team&&q.rep===p.rep).forEach(upd); else upd(p);
    closeEdit();save();renderAll();
  };
  $('#e_del').onclick=()=>{ if(!confirm(p.name+' 삭제?'))return;
    pushUndo();
    delete A.seats[p.id]; A.roster=A.roster.filter(q=>q.id!==p.id); A.order=A.order.filter(id=>id!==p.id);
    closeEdit();save();renderAll(); };
  $('#e_x').onclick=closeEdit;
}
function closeEdit(){$('#editbox').style.display='none';}

/* ── 엑셀 업로드/양식/자동배정/내보내기 ── */
$('#btnUp').onclick=()=>$('#file').click();
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return; e.target.value='';
  const buf=await f.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  if(!rows.length){tip('행이 없습니다');return;}
  if(A.roster.length && !confirm('기존 명단 '+A.roster.length+'명을 지우고 새 명단으로 바꿀까요? (배정도 초기화)')) return;
  pushUndo();
  A.roster=[];A.order=[];A.seats={};
  let phone='';
  rows.forEach(r0=>{
    const p=AssignCore.makePerson(r0,M);
    if(!p.name)return;
    if(p.phone)phone=p.phone; else if(A.roster.length&&p.team===A.roster[A.roster.length-1].team&&p.rep===A.roster[A.roster.length-1].rep)p.phone=phone;
    A.roster.push(p);A.order.push(p.id);
  });
  save();renderAll();tip(A.roster.length+'명 불러옴 — [자동 배정]을 누르거나 이름을 좌석으로 드래그하세요');
});
$('#btnTpl').onclick=()=>{
  const aoa=[['팀','대표자명','참석자 이름','연락처','층수','구역지정','연석여부','VIP 여부','시야제한석 가능'],
    ['MBC','김부장','홍길동','010-1234-5678','1층','I1','O','O','X'],
    ['MBC','김부장','김철수','','1층','I1','O','X','X'],
    ['팬 VIP','이대표','박영희','010-2222-3333','1층','H1','O','X','X'],
    ['일반','최명','이몽룡','','2층','','X','X','O']];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=aoa[0].map(()=>({wch:14}));
  const g=[['안내'],['· 구역 코드: 1층 '+M.floors['1층'].join(', ')],['            2층 '+M.floors['2층'].join(', ')],
    ['· 구역지정은 쉼표로 여러 개 가능, 빈칸이면 층 전체(층도 빈칸이면 전관)'],
    ['· 연석/VIP/시야제한석: O 또는 X (Y/N, 예/아니오도 인식)'],
    ['· 연락처는 대표자 줄에만 적어도 그룹에 이어집니다 (kyk2 명단용)'],
    ['· 업로드 후 화면에서도 ✎ 버튼으로 개별/그룹 옵션 수정 가능']];
  const ws2=XLSX.utils.aoa_to_sheet(g); ws2['!cols']=[{wch:70}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'명단');XLSX.utils.book_append_sheet(wb,ws2,'안내');
  XLSX.writeFile(wb,'좌석배정_양식.xlsx');
};
$('#btnAuto').onclick=()=>{
  if(!A.roster.length){tip('먼저 명단을 업로드하세요');return;}
  pushUndo();
  const allowFree=$('#okFree').checked;
  /* 규칙에 어긋난 기존 배정 회수: 다른 팀 블록 점유(항상), 자유석 점유(자유석 금지일 때) */
  let recall=0; const seats1={};
  for(const pid in A.seats){
    const p=byId(pid); if(!p) continue;
    const key=A.seats[pid], own=M.owner[key];
    const bad=(own && !AssignCore.teamMatchesBlock(p.team,own)) || (!own && !allowFree);
    if(bad){recall++;continue;}
    seats1[pid]=key;
  }
  const {seatOf,warnings}=AssignCore.autoAssign(M,A.roster,A.order,seats1,{allowFree});
  A.seats=seatOf; save(); renderAll();
  const notes=warnings.slice();
  if(recall) notes.unshift('블록 규칙에 어긋난 기존 배정 '+recall+'건을 회수해 다시 배정했습니다'+(allowFree?'':' (자유석 금지)'));
  const wb=$('#warnbox');
  if(notes.length){wb.style.display='block';wb.textContent='⚠ '+notes.join('\n⚠ ');}
  else{wb.style.display='none';}
  tip('자동 배정 완료 — 미배정 '+A.order.filter(id=>!A.seats[id]).length+'명'+(recall?' · 회수 '+recall+'건':''));
};
$('#btnClr').onclick=()=>{ if(!confirm('모든 배정을 해제할까요? (명단은 유지)'))return; pushUndo(); A.seats={};save();renderAll(); };
function assignedRows(){
  return A.order.map(byId).filter(p=>p&&A.seats[p.id]).map(p=>{const s=M.seatsByKey[A.seats[p.id]];return {p,s};})
    .sort((a,b)=>a.p.team.localeCompare(b.p.team)||a.p.rep.localeCompare(b.p.rep)||a.s.zid.localeCompare(b.s.zid)||a.s.n-b.s.n);
}
$('#btnXls').onclick=()=>{
  const rows=assignedRows().map(({p,s})=>[p.team,p.rep,p.name,p.phone,M.floorOf(M.byZone[s.zid]),s.zid,s.n,(s.r+1)+'열',s.b==='y'?'시야제한':'' ]);
  const un=A.order.map(byId).filter(p=>p&&!A.seats[p.id]).map(p=>[p.team,p.rep,p.name,p.phone,'','미배정','','','']);
  const aoa=[['팀','대표자명','참석자 이름','연락처','층','구역','좌석번호','열','비고']].concat(rows,un);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=aoa[0].map(()=>({wch:12}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'배정결과');
  XLSX.writeFile(wb,'장충_좌석배정_결과.xlsx');
};
$('#btnKyk').onclick=()=>{
  const rows=assignedRows().map(({p,s})=>[p.rep||p.team,p.name,p.phone,s.zid,s.n,p.vip?'VIP':'']);
  const aoa=[['대분류','소분류','연락처','구역','좌석','등급']].concat(rows);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:14},{wch:12},{wch:15},{wch:7},{wch:7},{wch:7}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'명단');
  XLSX.writeFile(wb,'kyk2_초대명단_업로드용.xlsx');
  tip('kyk2-ticket 관리자 화면 → 명단 업로드에 이 파일을 그대로 올리면 됩니다');
};
window.__assign={get A(){return A;},get M(){return M;},get SEL(){return SEL;},place,unplace,groupPlaceAt,groupMoveToZone,doUndo,doRedo,toggleSel,renderAll};  /* 테스트 훅(저장 무력화는 테스트에서 교체) */
boot();
</script>
