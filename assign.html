<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>좌석 배정 · 장충체육관</title>
<style>
:root{--bg:#12171D;--panel:#1A2129;--line:#2B3540;--ink:#EAF0F6;--mute:#AEBAC6;--faint:#77848F;
--maple:#FFC61A;--ok:#40C057;--warn:#F2C744;--bad:#E24A4A;--sel:#4DABF7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
h1{font-size:19px;margin:4px 0 2px}
h1 small{font-size:12px;color:var(--faint);font-weight:600;margin-left:8px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top .sp{flex:1}
a.lnk{color:var(--mute);font-size:12.5px;text-decoration:none;border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.badge{font-size:11.5px;color:var(--faint)}
.badge.on{color:var(--ok)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:#4A5866}
.btn.acc{background:#2A3A2C;border-color:#3E5F42}
.btn.warn{background:#3A2B2B;border-color:#6E3B3B}
.btn:disabled{opacity:.45;cursor:default}
.cnt{font-size:12.5px;color:var(--mute);margin-left:auto}
.cnt b{color:var(--maple)}
.main{display:grid;grid-template-columns:1fr 320px;gap:14px;align-items:start}
@media (max-width:980px){.main{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.ztabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ztab{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
.ztab.on{border-color:var(--maple);color:var(--maple);font-weight:700}
.ztab i{font-style:normal;color:var(--faint);font-size:10.5px;margin-left:4px}
.ztab.full i{color:var(--ok)}
.gridwrap{overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:#141A21}
.zhead{font-size:12.5px;color:var(--mute);margin:0 0 8px}
.row{display:flex;gap:3px;margin-bottom:3px;align-items:center}
.rl{width:74px;min-width:74px;font-size:10.5px;color:var(--faint);text-align:right;padding-right:6px}
.seat{width:46px;height:27px;min-width:46px;border-radius:5px;border:1px solid #33404C;background:#20303E;
  font-size:10.5px;display:flex;align-items:center;justify-content:center;color:#9DB4C8;cursor:default;
  overflow:hidden;white-space:nowrap;user-select:none;position:relative}
.seat.gap{visibility:hidden}
.seat.o{cursor:pointer}
.seat.y{background:#3A3418;border-color:#5C511F;color:#D8C25A}
.seat.x{background:#2A1D1D;border-color:#4A2B2B;color:#7A5252;cursor:not-allowed}
.seat.c{background:#1C2E40;border-color:#2E4B66;color:#5E88AC;cursor:not-allowed}
.seat.blk{box-shadow:inset 0 0 0 2px var(--bcol,transparent)}
.seat.asg{background:#213326;border-color:#3E5F42;color:#D9F2DC;font-weight:700;font-size:11px;cursor:grab}
.seat.asg.y{background:#3A3418;color:#F2E4A0}
.seat.hov{outline:2px solid var(--sel)}
.seat.selp{outline:2px solid var(--maple)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--faint);margin-top:8px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.side h3{font-size:13.5px;margin:2px 0 8px}
.side h3 b{color:var(--maple)}
.chips{display:flex;flex-direction:column;gap:5px;max-height:520px;overflow:auto}
.ghead{font-size:11.5px;color:var(--faint);margin:7px 0 1px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.chip{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#141A21;border-radius:8px;
  padding:5px 8px;font-size:12.5px;cursor:grab}
.chip.selp{border-color:var(--maple);box-shadow:0 0 0 1px var(--maple)}
.chip .nm{font-weight:700}
.chip .tags{margin-left:auto;display:flex;gap:3px}
.tg{font-size:9.5px;border-radius:4px;padding:1px 4px;background:#2A3540;color:var(--mute)}
.tg.vip{background:#4A3413;color:#FFC61A}.tg.con{background:#1C3A44;color:#5BD0E8}.tg.y{background:#3A3418;color:#D8C25A}
.chip .ed{border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;padding:0 2px}
#editbox{position:fixed;z-index:30;background:#1E2732;border:1px solid #3A4856;border-radius:12px;padding:12px;width:270px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);display:none}
#editbox label{display:flex;align-items:center;gap:6px;font-size:12.5px;margin:5px 0;color:var(--mute)}
#editbox input[type=text]{flex:1;background:#12171D;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px 7px;font:inherit;font-size:12.5px}
#editbox select{background:#12171D;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:4px;font:inherit;font-size:12.5px}
#warnbox{margin-top:10px;font-size:12px;color:#F0B4B4;white-space:pre-wrap;display:none;border:1px solid #5A3232;border-radius:9px;padding:8px 10px;background:#241A1A}
#tip{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#0E1A24;border:1px solid #2E4B66;
  color:#CFE6F8;padding:8px 14px;border-radius:10px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#tip.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>좌석 배정<small>장충체육관 · 8/27 신인감독 김연경2</small></h1>
    <span class="badge" id="sync">불러오는 중…</span>
    <span class="sp"></span>
    <a class="lnk" href="index.html">← 좌석 배치도(사석·블록)</a>
  </div>

  <div class="bar">
    <button class="btn" id="btnUp">① 명단 엑셀 업로드</button>
    <input type="file" id="file" accept=".xlsx,.xls" style="display:none">
    <button class="btn" id="btnTpl">양식 받기</button>
    <button class="btn acc" id="btnAuto">② 자동 배정</button>
    <button class="btn" id="btnXls">③ 배정결과 엑셀</button>
    <button class="btn" id="btnKyk">③ kyk2 명단 엑셀</button>
    <button class="btn warn" id="btnClr">배정 전체 해제</button>
    <span class="cnt" id="cnt"></span>
  </div>

  <div class="main">
    <div class="panel">
      <div class="ztabs" id="fltabs"></div>
      <div class="ztabs" id="ztabs"></div>
      <div class="gridwrap" id="grid"></div>
      <div class="legend">
        <span><i style="background:#20303E;border:1px solid #33404C"></i>빈 좌석(번호)</span>
        <span><i style="background:#213326;border:1px solid #3E5F42"></i>배정됨(이름)</span>
        <span><i style="background:#3A3418"></i>시야제한석</span>
        <span><i style="background:#2A1D1D"></i>사석</span>
        <span><i style="background:#1C2E40"></i>카메라</span>
        <span>테두리색 = 팀 지정블록</span>
      </div>
      <div id="warnbox"></div>
    </div>
    <div class="panel side">
      <h3>미배정 <b id="left">0</b>명 <span style="font-weight:400;color:var(--faint);font-size:11px">· 드래그: 좌석으로 놓기 / 순서 바꾸기 · 클릭: 선택 후 좌석 클릭</span></h3>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</div>

<div id="editbox"></div>
<div id="tip"></div>
<script src="assets/xlsx.full.min.js"></script>
<script src="assets/assign-core.js"></script>
<script>
'use strict';
const $=s=>document.querySelector(s);
let M=null, VENJC=null;                       /* 좌석 모델 */
let A={roster:[],order:[],seats:{},updatedAt:0};   /* 배정 상태(공유 저장) */
let CURFL='1층', CURZ=null, SELP=null, DRAGP=null;
let STATE=null, shared=false, lastLocal=0, pushT=null;
const LSKEY='jc-assign-v1';
const teamCol={}; /* 팀 지정블록 색 */

function tip(m){const t=$('#tip');t.textContent=m;t.classList.add('on');clearTimeout(tip._t);tip._t=setTimeout(()=>t.classList.remove('on'),2400);}
function badge(m,ok){const b=$('#sync');b.textContent=m;b.className='badge'+(ok?' on':'');}

/* ── 부팅: index.html에서 도면 추출 + 공유 상태 ── */
async function boot(){
  try{
    const html=await (await fetch('index.html',{cache:'no-store'})).text();
    const mm=html.match(/const VEN=(\{[\s\S]*?\});<\/script>/);
    VENJC=JSON.parse(mm[1]).jc;
  }catch(e){ badge('도면(index.html)을 읽지 못했습니다',false); return; }
  let rsv=VENJC.rsv;
  try{
    const r=await fetch('api/state',{cache:'no-store'});
    if(r.ok){ STATE=await r.json(); shared=true;
      const jc=(STATE&&STATE.venues&&STATE.venues.jc)||{};
      if(jc.rsv&&jc.rsv.length) rsv=jc.rsv;
      if(jc.assign) A=jc.assign;
      badge('공유 저장소 연결됨 — 모두 같은 배정을 봅니다',true);
    } else throw 0;
  }catch(e){
    shared=false;
    try{const raw=localStorage.getItem(LSKEY); if(raw) A=JSON.parse(raw);}catch(x){}
    badge('공유 저장소 없음 — 이 기기 브라우저에만 저장됩니다',false);
  }
  (VENJC.teams||[]).forEach(t=>teamCol[t.name]=t.col);
  (rsv||[]).forEach(e=>{ if(e.note&&e.col) teamCol[e.note]=e.col; });
  M=AssignCore.buildModel(VENJC, rsv);
  A.roster=A.roster||[]; A.order=A.order||A.roster.map(p=>p.id); A.seats=A.seats||{};
  CURZ=M.floors['1층'][0];
  renderAll();
  if(shared) setInterval(poll,15000);
}
async function poll(){
  if(DRAGP||SELP||Date.now()-lastLocal<10000) return;
  try{const r=await fetch('api/state',{cache:'no-store'}); if(!r.ok)return;
    const o=await r.json(); const jc=o&&o.venues&&o.venues.jc;
    if(jc&&jc.assign&&jc.assign.updatedAt>(A.updatedAt||0)){ STATE=o; A=jc.assign; renderAll(); }
  }catch(e){}
}
function save(){
  A.updatedAt=Date.now(); lastLocal=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(A));}catch(e){}
  if(!shared){ badge('이 기기 브라우저에 저장됨',false); return; }
  badge('저장 중…',true);
  clearTimeout(pushT); pushT=setTimeout(async()=>{
    try{
      const r0=await fetch('api/state',{cache:'no-store'});
      let o=r0.ok? await r0.json() : null;
      if(!o||typeof o!=='object') o={ver:1,rev:20260825,venues:{}};
      o.venues=o.venues||{}; o.venues.jc=o.venues.jc||{};
      o.venues.jc.assign=A; o.updatedAt=Date.now(); o.rev=Math.max(o.rev||0,20260825);
      const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
      if(r.ok){const d=new Date();badge('공유 저장소에 저장됨 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),true);}
      else badge('공유 저장 실패('+r.status+') — 이 기기에만 저장됨',false);
    }catch(e){badge('공유 저장 실패 — 이 기기에만 저장됨',false);}
  },1500);
}

/* ── 렌더 ── */
const pidOnSeat={};
function rebuildSeatIdx(){ for(const k in pidOnSeat)delete pidOnSeat[k]; for(const pid in A.seats)pidOnSeat[A.seats[pid]]=pid; }
function byId(id){ return A.roster.find(p=>p.id===id); }
function renderAll(){ rebuildSeatIdx(); renderTabs(); renderGrid(); renderChips(); renderCnt(); }
function renderTabs(){
  $('#fltabs').innerHTML=['1층','2층'].map(f=>'<button class="ztab'+(f===CURFL?' on':'')+'" data-fl="'+f+'">'+f+'</button>').join('');
  $('#ztabs').innerHTML=M.floors[CURFL].map(zid=>{
    const zone=M.byZone[zid];
    const tot=zone.seats.filter(s=>s.b==='o'||s.b==='y').length;
    const asg=zone.seats.filter(s=>pidOnSeat[s.key]).length;
    return '<button class="ztab'+(zid===CURZ?' on':'')+(asg&&asg>=tot?' full':'')+'" data-z="'+zid+'">'+zid+'<i>'+asg+'/'+tot+'</i></button>';
  }).join('');
}
function renderGrid(){
  const zone=M.byZone[CURZ]; if(!zone){$('#grid').innerHTML='';return;}
  const cell={}; zone.seats.forEach(s=>cell[s.r+'_'+s.c]=s);
  let h='<div class="zhead"><b>'+CURZ+'</b> 구역 · 1열이 코트쪽 · 좌석을 클릭/드래그해 이동, 이름을 좌석에 놓아 배정</div>';
  for(let r=0;r<zone.nR;r++){
    h+='<div class="row"><span class="rl">'+(r+1)+'열'+(r===0?'(코트쪽)':'')+'</span>';
    for(let c=0;c<zone.nC;c++){
      const s=cell[r+'_'+c];
      if(!s){h+='<span class="seat gap"></span>';continue;}
      const pid=pidOnSeat[s.key], p=pid&&byId(pid);
      const own=M.owner[s.key];
      let cls='seat '+s.b+(p?' asg':'')+(own?' blk':'')+(SELP&&pid===SELP?' selp':'');
      let sty=own?' style="--bcol:'+(teamCol[own]||'#556')+'"':'';
      const label=p?p.name:(s.b==='x'?'사석':(s.b==='c'?'카메라':s.n));
      const tt=CURZ+' '+s.n+'번'+(s.b==='y'?' · 시야제한':'')+(own?' · '+own+' 블록':'')+(p?' · '+p.team+' '+p.name:'');
      h+='<span class="'+cls+'"'+sty+' data-k="'+s.key+'" title="'+tt+'"'+(p?' draggable="true"':'')+'>'+label+'</span>';
    }
    h+='</div>';
  }
  $('#grid').innerHTML=h;
}
function renderChips(){
  const un=A.order.map(byId).filter(p=>p&&!A.seats[p.id]);
  const groups=[]; const gi={};
  un.forEach(p=>{const gk=p.team+' · '+(p.rep||'-');
    if(gi[gk]==null){gi[gk]=groups.length;groups.push({gk,list:[]});} groups[gi[gk]].list.push(p);});
  $('#left').textContent=un.length;
  $('#chips').innerHTML=groups.map(g=>'<div class="ghead">'+esc(g.gk)+' <span style="float:right">'+g.list.length+'명</span></div>'
    +g.list.map(p=>chipHTML(p)).join('')).join('')||'<div style="color:var(--faint);font-size:12.5px">모두 배정되었습니다 🎉</div>';
}
function chipHTML(p){
  return '<div class="chip'+(SELP===p.id?' selp':'')+'" draggable="true" data-p="'+p.id+'">'
    +'<span class="nm">'+esc(p.name)+'</span>'
    +'<span style="color:var(--faint);font-size:11px">'+esc(p.fl||'층무관')+(p.zones.length?' '+p.zones.join(','):'')+'</span>'
    +'<span class="tags">'+(p.vip?'<span class="tg vip">VIP</span>':'')+(p.con?'<span class="tg con">연석</span>':'')+(p.okY?'<span class="tg y">시야OK</span>':'')+'</span>'
    +'<button class="ed" data-ed="'+p.id+'" title="옵션 수정">✎</button></div>';
}
function renderCnt(){
  const tot=A.roster.length, asg=Object.keys(A.seats).length;
  $('#cnt').innerHTML='명단 <b>'+tot+'</b>명 · 배정 <b>'+asg+'</b> · 미배정 <b>'+(tot-asg)+'</b>';
}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ── 배정 조작 ── */
function canSit(p,s){ return AssignCore.seatAllowed(M,p,s,{}, false) || M.owner[s.key]===p.team; }
function place(pid,key){
  const p=byId(pid), s=M.seatsByKey[key]; if(!p||!s)return;
  if(s.b==='x'||s.b==='c'){tip('사석·카메라석에는 배정할 수 없습니다');return;}
  if(s.b==='y'&&!p.okY){tip(p.name+'님은 시야제한석 불가 설정입니다 — 옵션(✎)에서 허용으로 바꾸면 가능');return;}
  const own=M.owner[key]; if(own&&own!==p.team){tip('이 좌석은 '+own+' 지정블록입니다');return;}
  const occ=pidOnSeat[key];
  const prev=A.seats[pid];
  if(occ&&occ!==pid){ if(prev){A.seats[occ]=prev;} else {delete A.seats[occ];} }  /* 자리 바꿈/밀어내기 */
  A.seats[pid]=key;
  SELP=null; save(); renderAll();
}
function unplace(pid){ if(A.seats[pid]){delete A.seats[pid]; save(); renderAll();} }

/* 클릭 흐름: 칩/배정좌석 클릭=선택 → 좌석 클릭=이동 */
document.addEventListener('click',e=>{
  const ed=e.target.closest('[data-ed]'); if(ed){openEdit(ed.dataset.ed,e);return;}
  const chip=e.target.closest('.chip'); if(chip){SELP=(SELP===chip.dataset.p)?null:chip.dataset.p; renderAll(); return;}
  const st=e.target.closest('.seat[data-k]');
  if(st){
    const key=st.dataset.k, occ=pidOnSeat[key];
    if(SELP){ place(SELP,key); return; }
    if(occ){ SELP=occ; renderAll(); tip(byId(occ).name+' 선택됨 — 옮길 좌석을 클릭하거나, 미배정으로 빼려면 오른쪽 패널로 드래그'); }
    return;
  }
  if(!e.target.closest('#editbox')) closeEdit();
});
/* 드래그 */
document.addEventListener('dragstart',e=>{
  const chip=e.target.closest('.chip'); const st=e.target.closest('.seat.asg');
  if(chip){DRAGP=chip.dataset.p;e.dataTransfer.setData('text/plain',DRAGP);}
  else if(st){DRAGP=pidOnSeat[st.dataset.k];e.dataTransfer.setData('text/plain',DRAGP);}
});
document.addEventListener('dragend',()=>{DRAGP=null;document.querySelectorAll('.hov').forEach(x=>x.classList.remove('hov'));});
document.addEventListener('dragover',e=>{
  const st=e.target.closest('.seat[data-k]'); const chip=e.target.closest('.chip'); const panel=e.target.closest('.side');
  if((st&&DRAGP)||(chip&&DRAGP)||(panel&&DRAGP)){e.preventDefault();
    document.querySelectorAll('.hov').forEach(x=>x.classList.remove('hov'));
    if(st)st.classList.add('hov');}
});
document.addEventListener('drop',e=>{
  e.preventDefault();
  const pid=DRAGP||e.dataTransfer.getData('text/plain'); if(!pid)return;
  const st=e.target.closest('.seat[data-k]');
  if(st){place(pid,st.dataset.k);DRAGP=null;return;}
  const chip=e.target.closest('.chip');
  if(chip&&chip.dataset.p!==pid){                     /* 큐 순서 변경 */
    const from=A.order.indexOf(pid), to=A.order.indexOf(chip.dataset.p);
    if(from>=0&&to>=0){A.order.splice(from,1);A.order.splice(to,0,pid);save();renderChips();}
    DRAGP=null;return;
  }
  if(e.target.closest('.side')){unplace(pid);DRAGP=null;}
});
/* 탭 */
$('#fltabs').addEventListener('click',e=>{const b=e.target.closest('[data-fl]');if(!b)return;CURFL=b.dataset.fl;CURZ=M.floors[CURFL][0];renderAll();});
$('#ztabs').addEventListener('click',e=>{const b=e.target.closest('[data-z]');if(!b)return;CURZ=b.dataset.z;renderTabs();renderGrid();});

/* ── 옵션 수정 ── */
function openEdit(pid,e){
  const p=byId(pid); if(!p)return;
  const bx=$('#editbox');
  bx.innerHTML='<div style="font-weight:700;margin-bottom:4px">'+esc(p.name)+' <span style="color:var(--faint);font-weight:400;font-size:11.5px">'+esc(p.team)+' · '+esc(p.rep)+'</span></div>'
   +'<label>층수 <select id="e_fl"><option value="">무관</option><option'+(p.fl==='1층'?' selected':'')+'>1층</option><option'+(p.fl==='2층'?' selected':'')+'>2층</option></select></label>'
   +'<label>구역 <input type="text" id="e_z" value="'+esc(p.zones.join(','))+'" placeholder="예: H1,I1 (빈칸=전체)"></label>'
   +'<label><input type="checkbox" id="e_con"'+(p.con?' checked':'')+'> 연석(붙어앉기)</label>'
   +'<label><input type="checkbox" id="e_vip"'+(p.vip?' checked':'')+'> VIP(앞자리)</label>'
   +'<label><input type="checkbox" id="e_y"'+(p.okY?' checked':'')+'> 시야제한석 가능</label>'
   +'<label><input type="checkbox" id="e_grp"> 같은 팀·대표자 전원에게 적용</label>'
   +'<div style="display:flex;gap:6px;margin-top:8px"><button class="btn acc" id="e_ok">저장</button><button class="btn warn" id="e_del">명단에서 삭제</button><button class="btn" id="e_x">닫기</button></div>';
  bx.style.display='block';
  const r=e.target.getBoundingClientRect();
  bx.style.left=Math.min(window.innerWidth-290,r.left-140)+'px'; bx.style.top=Math.min(window.innerHeight-260,r.bottom+8)+'px';
  $('#e_ok').onclick=()=>{
    const upd=q=>{q.fl=$('#e_fl').value;q.zones=AssignCore.parseZones($('#e_z').value,M);q.con=$('#e_con').checked;q.vip=$('#e_vip').checked;q.okY=$('#e_y').checked;};
    if($('#e_grp').checked) A.roster.filter(q=>q.team===p.team&&q.rep===p.rep).forEach(upd); else upd(p);
    closeEdit();save();renderAll();
  };
  $('#e_del').onclick=()=>{ if(!confirm(p.name+' 삭제?'))return;
    delete A.seats[p.id]; A.roster=A.roster.filter(q=>q.id!==p.id); A.order=A.order.filter(id=>id!==p.id);
    closeEdit();save();renderAll(); };
  $('#e_x').onclick=closeEdit;
}
function closeEdit(){$('#editbox').style.display='none';}

/* ── 엑셀 업로드/양식/자동배정/내보내기 ── */
$('#btnUp').onclick=()=>$('#file').click();
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f)return; e.target.value='';
  const buf=await f.arrayBuffer();
  const wb=XLSX.read(buf,{type:'array'});
  const ws=wb.Sheets[wb.SheetNames[0]];
  const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
  if(!rows.length){tip('행이 없습니다');return;}
  if(A.roster.length && !confirm('기존 명단 '+A.roster.length+'명을 지우고 새 명단으로 바꿀까요? (배정도 초기화)')) return;
  A.roster=[];A.order=[];A.seats={};
  let phone='';
  rows.forEach(r0=>{
    const p=AssignCore.makePerson(r0,M);
    if(!p.name)return;
    if(p.phone)phone=p.phone; else if(A.roster.length&&p.team===A.roster[A.roster.length-1].team&&p.rep===A.roster[A.roster.length-1].rep)p.phone=phone;
    A.roster.push(p);A.order.push(p.id);
  });
  save();renderAll();tip(A.roster.length+'명 불러옴 — [자동 배정]을 누르거나 이름을 좌석으로 드래그하세요');
});
$('#btnTpl').onclick=()=>{
  const aoa=[['팀','대표자명','참석자 이름','연락처','층수','구역지정','연석여부','VIP 여부','시야제한석 가능'],
    ['MBC','김부장','홍길동','010-1234-5678','1층','I1','O','O','X'],
    ['MBC','김부장','김철수','','1층','I1','O','X','X'],
    ['팬 VIP','이대표','박영희','010-2222-3333','1층','H1','O','X','X'],
    ['일반','최명','이몽룡','','2층','','X','X','O']];
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=aoa[0].map(()=>({wch:14}));
  const g=[['안내'],['· 구역 코드: 1층 '+M.floors['1층'].join(', ')],['            2층 '+M.floors['2층'].join(', ')],
    ['· 구역지정은 쉼표로 여러 개 가능, 빈칸이면 층 전체(층도 빈칸이면 전관)'],
    ['· 연석/VIP/시야제한석: O 또는 X (Y/N, 예/아니오도 인식)'],
    ['· 연락처는 대표자 줄에만 적어도 그룹에 이어집니다 (kyk2 명단용)'],
    ['· 업로드 후 화면에서도 ✎ 버튼으로 개별/그룹 옵션 수정 가능']];
  const ws2=XLSX.utils.aoa_to_sheet(g); ws2['!cols']=[{wch:70}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'명단');XLSX.utils.book_append_sheet(wb,ws2,'안내');
  XLSX.writeFile(wb,'좌석배정_양식.xlsx');
};
$('#btnAuto').onclick=()=>{
  if(!A.roster.length){tip('먼저 명단을 업로드하세요');return;}
  const {seatOf,warnings}=AssignCore.autoAssign(M,A.roster,A.order,A.seats);
  A.seats=seatOf; save(); renderAll();
  const wb=$('#warnbox');
  if(warnings.length){wb.style.display='block';wb.textContent='⚠ '+warnings.join('\n⚠ ');}
  else{wb.style.display='none';}
  tip('자동 배정 완료 — 미배정 '+A.order.filter(id=>!A.seats[id]).length+'명');
};
$('#btnClr').onclick=()=>{ if(!confirm('모든 배정을 해제할까요? (명단은 유지)'))return; A.seats={};save();renderAll(); };
function assignedRows(){
  return A.order.map(byId).filter(p=>p&&A.seats[p.id]).map(p=>{const s=M.seatsByKey[A.seats[p.id]];return {p,s};})
    .sort((a,b)=>a.p.team.localeCompare(b.p.team)||a.p.rep.localeCompare(b.p.rep)||a.s.zid.localeCompare(b.s.zid)||a.s.n-b.s.n);
}
$('#btnXls').onclick=()=>{
  const rows=assignedRows().map(({p,s})=>[p.team,p.rep,p.name,p.phone,M.floorOf(M.byZone[s.zid]),s.zid,s.n,(s.r+1)+'열',s.b==='y'?'시야제한':'' ]);
  const un=A.order.map(byId).filter(p=>p&&!A.seats[p.id]).map(p=>[p.team,p.rep,p.name,p.phone,'','미배정','','','']);
  const aoa=[['팀','대표자명','참석자 이름','연락처','층','구역','좌석번호','열','비고']].concat(rows,un);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=aoa[0].map(()=>({wch:12}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'배정결과');
  XLSX.writeFile(wb,'장충_좌석배정_결과.xlsx');
};
$('#btnKyk').onclick=()=>{
  const rows=assignedRows().map(({p,s})=>[p.rep||p.team,p.name,p.phone,s.zid,s.n,p.vip?'VIP':'']);
  const aoa=[['대분류','소분류','연락처','구역','좌석','등급']].concat(rows);
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:14},{wch:12},{wch:15},{wch:7},{wch:7},{wch:7}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'명단');
  XLSX.writeFile(wb,'kyk2_초대명단_업로드용.xlsx');
  tip('kyk2-ticket 관리자 화면 → 명단 업로드에 이 파일을 그대로 올리면 됩니다');
};
window.__assign={get A(){return A;},get M(){return M;},place,unplace,renderAll,save:()=>{}};  /* 테스트 훅(저장 무력화는 테스트에서 교체) */
boot();
</script>
</body>
</html>
