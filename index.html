<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경기장 좌석 배치 · 사석 관리</title>
<style>
:root{
  --bg:#0E1319; --panel:#161D25; --panel2:#1D2731; --line:#2B3947;
  --ink:#EAF0F6; --mute:#8DA0B2; --faint:#5E6E7E;
  --maple:#D89A5C; --held:#E24A4A; --view:#F2C744; --cons:#3D8FD6; --tbl:#B77BC7; --pick:#4DD0E1;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:radial-gradient(120% 80% at 50% -10%,#19242F 0%,transparent 62%),var(--bg);
  color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1340px;margin:0 auto;padding:16px 18px 60px}

/* 경기장 탭 */
.vtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.vtab{border:0;background:transparent;color:var(--faint);font:inherit;font-size:14px;font-weight:700;
  padding:12px 18px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;letter-spacing:-.01em}
.vtab:hover{color:var(--mute)}
.vtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--maple)}
.vtab small{display:block;font-size:10.5px;font-weight:600;color:var(--faint);letter-spacing:.1em;margin-top:2px}
.vtab[aria-selected="true"] small{color:var(--maple)}

.board{position:relative;border:1px solid #30404F;border-radius:14px;overflow:hidden;
  background:linear-gradient(#0B0F13,#141B22);box-shadow:0 16px 42px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.05)}
.board::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.45;
  background-image:radial-gradient(rgba(255,255,255,.05) .6px,transparent .7px);background-size:4px 4px}
.board-in{position:relative;z-index:1;padding:16px 20px}
.eyebrow{display:flex;flex-wrap:wrap;gap:9px;align-items:baseline;font-size:11px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase}
.eyebrow b{color:var(--maple);letter-spacing:.16em}
h1{margin:6px 0 14px;font-size:clamp(17px,3vw,23px);font-weight:800;letter-spacing:-.02em}
h1 span{color:var(--mute);font-weight:500;font-size:.62em;letter-spacing:0;margin-left:8px}
.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{flex:1 1 105px;background:#070A0D;border:1px solid #263240;border-radius:9px;padding:9px 12px 8px}
.stat .k{font-size:9.5px;letter-spacing:.12em;color:var(--faint)}
.stat .v{font-size:clamp(18px,3.4vw,25px);font-weight:700;line-height:1.15;margin-top:2px;text-shadow:0 0 14px currentColor}
.stat .d{font-size:10px;color:var(--faint);margin-top:1px;min-height:12px}
.stat .d b{color:var(--maple)}
.c1{color:#EBD6A8}.c2{color:#FF7B7B}.c3{color:#FFDE7A}.c4{color:#8FC4F0}.c5{color:#84E2BE}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 11px}
.seg{display:flex;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;color:var(--mute);font:inherit;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:7px;cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--maple);color:#1A1206}
.seg.paint button[aria-pressed="true"][data-tool="held"]{background:var(--held);color:#fff}
.seg.paint button[aria-pressed="true"][data-tool="free"]{background:#3E8F6E;color:#fff}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--mute);font:inherit;font-size:12px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer}
.btn:hover{color:var(--ink);border-color:#3E5266}
.btn.warn:hover{color:#FF9B9B;border-color:#6A3235}
.spacer{flex:1}
.syncst{font-size:11px;color:var(--faint);white-space:nowrap}
.syncst.on{color:#7BE3B0}
:focus-visible{outline:2px solid var(--pick);outline-offset:2px}

.grid{display:grid;grid-template-columns:minmax(0,1.28fr) minmax(0,1fr);gap:15px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;align-items:center;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--panel2)}
.card-h h2{margin:0;font-size:13px;font-weight:700}
.card-h .sub{font-size:11.5px;color:var(--faint)}

.plan{overflow:auto;max-height:80vh;position:relative}
.plan.grab{cursor:grab}.plan.grabbing{cursor:grabbing}
.plan svg{display:block;height:auto;width:calc(100% * var(--z,1));min-width:calc(600px * var(--z,1))}
.zoom{display:flex;align-items:center;gap:3px;margin-left:auto}
.zoom button{width:26px;height:24px;border:1px solid var(--line);background:var(--panel);color:var(--mute);
  font:inherit;font-size:13px;font-weight:700;border-radius:6px;cursor:pointer;line-height:1;padding:0}
.zoom button:hover{color:var(--ink);border-color:#3E5266}
.zoom .lv{font-size:11px;color:var(--faint);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.zoom .fit{width:auto;padding:0 8px;font-size:11px}
.zone{cursor:pointer}
.zone .zh{fill:transparent;stroke:transparent;stroke-width:3}
.zone:hover .zh{stroke:#FFFFFF80}
.zone.on .zh{stroke:var(--pick);stroke-width:3.5}
.zone.dim{opacity:.16;pointer-events:none}
.zl{font-weight:800;text-anchor:middle;pointer-events:none}
.zs{font-weight:700;text-anchor:middle;pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 15px;padding:10px 15px;border-top:1px solid var(--line);font-size:11.5px;color:var(--mute)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}

.detail{padding:13px 15px 16px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:290px;color:var(--faint);text-align:center;font-size:13px;line-height:1.7}
.empty b{color:var(--mute);font-size:14px;font-weight:700}
.dh{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.dh .zid{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.tag2{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.dm{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin:9px 0 11px}
.dm b{color:var(--ink)}.dm .r{color:#FF8A8A}.dm .y{color:#FFD95E}.dm .cn{color:#8FC4F0}
.zbtns{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.stage{display:grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;justify-content:center;align-items:center;gap:6px}
.ct{font-size:9.5px;letter-spacing:.3em;color:var(--maple);white-space:nowrap;text-align:center}
.ct.v{writing-mode:vertical-rl}
.sg{display:grid;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{border-radius:2px;background:#33414F;position:relative;display:flex;align-items:center;justify-content:center;
  font-size:var(--fs);font-weight:800;color:#0B1218;line-height:1}
.sq.y{background:var(--view)}
.sq.c{background:var(--cons)}
.sq.t{box-shadow:inset 0 0 0 1.5px var(--tbl)}
.sq.x{background:var(--held)}
.sq.ed::after{content:"";position:absolute;inset:0;border:1.2px solid #fff;border-radius:2px;opacity:.8}
.tipbar{font-size:11.5px;color:var(--faint);margin-top:10px;line-height:1.65}
.tipbar b{color:var(--ink)}
.chk{margin-top:16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.chk-h{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
.chk-h h2{margin:0;font-size:13px;font-weight:700}
.chk-h .cnt{margin-left:auto;font-size:11.5px;color:var(--maple);font-weight:700}
.chk-body{padding:6px 16px 14px}
.chk-v{margin-top:10px}
.chk-v h3{margin:8px 0 6px;font-size:11.5px;letter-spacing:.08em;color:var(--maple);font-weight:700}
.ci{display:flex;gap:10px;padding:9px 0;border-top:1px dashed #2C3A48}
.ci:first-of-type{border-top:0}
.ci input{margin-top:2px;width:15px;height:15px;accent-color:#3E8F6E;flex:0 0 auto;cursor:pointer}
.ci .body{min-width:0;flex:1}
.ci .t{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.45}
.ci .n{font-size:11.5px;color:var(--mute);line-height:1.6;margin-top:2px}
.ci .m{font-size:11px;color:var(--faint);line-height:1.6;margin-top:3px}
.ci .m b{color:#8FC4F0;font-weight:600}
.ci .m i{color:#FFD95E;font-style:normal;font-weight:600}
.ci.done .t,.ci.done .n,.ci.done .m{opacity:.42;text-decoration:line-through}
.mlog{margin-top:13px;border-top:1px solid var(--line);padding-top:11px}
.mlog h3{margin:0 0 7px;font-size:11px;letter-spacing:.08em;color:var(--maple);font-weight:700}
.mnone{font-size:11.5px;color:var(--faint);line-height:1.6}
.ml{padding:7px 0;border-top:1px dashed #2C3A48}
.ml:first-of-type{border-top:0}
.ml-t{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline;font-size:11.5px;color:var(--mute)}
.ml-t b{color:var(--ink)}
.ml-t .tm{color:var(--faint);font-size:10.5px}
.ml-t .seats{color:var(--faint);font-size:10.5px;flex:1 1 100%;line-height:1.5}
.mnote{width:100%;margin-top:5px;background:#0C1116;border:1px solid var(--line);border-radius:7px;
  color:var(--ink);font:inherit;font-size:12px;padding:7px 9px}
.mnote:focus{outline:none;border-color:#3E5266}
.mnote::placeholder{color:#4E5B68}
.notes{margin-top:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:13px 15px}
.notes h3{margin:0 0 8px;font-size:11.5px;letter-spacing:.1em;color:var(--maple);font-weight:700}
.notes ul{margin:0;padding-left:17px;font-size:12.2px;line-height:1.85;color:var(--mute)}
#tip{position:fixed;pointer-events:none;z-index:60;opacity:0;transition:opacity .1s;background:#000;
  border:1px solid #3A4854;border-radius:7px;padding:6px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function radialPlan(v){

    const f='#'+[1,3,5].map(i=>{const A=parseInt(col.substr(i,2),16),Bc=[226,74,74][(i-1)/2];

    let d,px,py,thin=false,f1=13.5,f2=9.5;

      thin=(h<26); if(w<44){f1=10.5;f2=8;}}

    const L=lum(f), tc = L>.62 ? '#D42B1E' : (L>.42 ? '#12181D' : '#FFFFFF');

    case 'S': return [z.nR-1-s.r, z.nC-1-s.c];
    case 'N': return [s.r, s.c];
    case 'E': return [s.c, z.nR-1-s.r];

}
function dims(v,z){
  if(v.key==='jc') return [z.nR,z.nC];

const ZL=[0.8,1,1.25,1.6,2,2.5,3.2,4];

function stepZoom(dir,ax,ay){
  const v=VEN[CUR]; let i=ZL.findIndex(x=>x>=v.z-0.001);
  if(i<0)i=ZL.length-1;
  i=Math.min(ZL.length-1,Math.max(0,i+dir));
  const el=document.getElementById('plan'), old=v.z;
  if(el&&ax===undefined){ax=el.clientWidth/2;ay=el.clientHeight/2;}
  setZoom(ZL[i]);
  if(el&&v.z!==old){const k=v.z/old;
    el.scrollLeft=(el.scrollLeft+ax)*k-ax; el.scrollTop=(el.scrollTop+ay)*k-ay;}
}

function applySeat(el,want){
  const v=VEN[CUR]; if(!el||!el.classList.contains('sq')||!v.sel)return;
  const z=v.zones.find(x=>x.id===v.sel);
  const s=z.seats.find(x=>x.r==el.dataset.r&&x.c==el.dataset.c); if(!s)return;
  if(want===null) want=!held(v,z,s);           /* 클릭 = 토글 */
  if(held(v,z,s)===want)return;
  if(want) G.add.push(rowLabel(v,z,s)+' '+s.n+'번');
  if(want===(s.b==='x')) v.ov.delete(KEY(z,s)); else v.ov.set(KEY(z,s),want);
  el.className='sq '+(want?'x':(s.b==='c'?'c':(s.b==='y'?'y':(s.b==='t'?'t':''))))+(ed(v,z,s)?' ed':'');
  el.textContent=(!want&&s.b==='c')?'C':''; dirty=true;

let dragWant=true;

function bindGrid(){
  const sg=document.getElementById('sg'); if(!sg)return;
  sg.addEventListener('pointerdown',e=>{if(!e.target.classList.contains('sq'))return;
    painting=true;dirty=false;moved=false;origin=e.target;
    const v=VEN[CUR],z=v.zones.find(x=>x.id===v.sel);
    const sd=z.seats.find(x=>x.r==e.target.dataset.r&&x.c==e.target.dataset.c);
    dragWant = sd ? !held(v,z,sd) : true;      /* 시작 좌석의 반대 상태로 일괄 적용 */
    G={add:[]};
    sg.setPointerCapture(e.pointerId);e.preventDefault();});
  sg.addEventListener('pointermove',e=>{
    if(!painting)return;
    const el=document.elementFromPoint(e.clientX,e.clientY);
    if(!el||!el.classList.contains('sq'))return;
    if(!moved){ if(el===origin)return; moved=true; paint(origin); }
    paint(el);
  });

const CRC=(function(){const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}

function zipStore(files){
  const enc=new TextEncoder(),u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];
  const parts=[],cen=[];let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name),d=f.data,crc=CRC(d),sz=d.length;
    const lh=new Uint8Array([].concat([80,75,3,4],u16(20),u16(2048),u16(0),u16(0),u16(0),u32(crc),u32(sz),u32(sz),u16(nm.length),u16(0)));
    parts.push(lh,nm,d); cen.push({nm:nm,crc:crc,sz:sz,off:off}); off+=lh.length+nm.length+sz;
  });
  const cd=[];let cl=0;
  cen.forEach(c=>{
    const h=new Uint8Array([].concat([80,75,1,2],u16(20),u16(20),u16(2048),u16(0),u16(0),u16(0),
      u32(c.crc),u32(c.sz),u32(c.sz),u16(c.nm.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(c.off)));
    cd.push(h,c.nm); cl+=h.length+c.nm.length;
  });
  const eo=new Uint8Array([].concat([80,75,5,6],u16(0),u16(0),u16(cen.length),u16(cen.length),u32(cl),u32(off),u16(0)));
  const all=parts.concat(cd,[eo]);let n=0;all.forEach(a=>n+=a.length);
  const out=new Uint8Array(n);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;

function sheetXML(rows,widths){

    if(dragged){el.scrollLeft=l0-dx;el.scrollTop=t0-dy;}
  });
  addEventListener('pointerup',()=>{
    if(!pan)return; pan=false;
    const el=document.querySelector('.plan'); if(el)el.classList.remove('grabbing');
    if(dragged){const b=e=>e.stopPropagation();
      document.addEventListener('click',b,{capture:true,once:true});}
  });
  app.addEventListener('wheel',e=>{
    const el=e.target.closest('.plan'); if(!el)return;
    e.preventDefault();
    const r=el.getBoundingClientRect();
    stepZoom(e.deltaY<0?1:-1, e.clientX-r.left, e.clientY-r.top);
  },{passive:false});
  app.addEventListener('dblclick',e=>{ if(e.target.closest('.plan')) stepZoom(1); });
})();
/* ── 자동 저장 · 공유 저장소 동기화 ── */
const LSKEY='volleyball-seatmap-v1';
function packState(){const o={ver:1,updatedAt:Date.now(),venues:{}};
  KEYS.forEach(k=>{o.venues[k]={ov:Array.from(VEN[k].ov.entries()),done:Array.from(VEN[k].done),log:VEN[k].log};});
  return o;}
function applyState(o){ if(!o||!o.venues)return false;
  KEYS.forEach(k=>{const x=o.venues[k]||{};
    VEN[k].ov=new Map(x.ov||[]); VEN[k].done=new Set(x.done||[]);
    VEN[k].log=(x.log||[]).map(e=>({t:e.t,zid:e.zid,seats:e.seats||e.add||[],note:e.note||''}));});
  return true;}
let shared=false,lastLocal=0,lastSeen=0,pushTimer=null,pushing=false;
function syncBadge(txt,ok){const el=document.getElementById('syncst');
  if(el){el.textContent=txt;el.className='syncst'+(ok?' on':'');}}
function schedulePersist(){ lastLocal=Date.now();
  try{localStorage.setItem(LSKEY,JSON.stringify(packState()));}catch(e){}
  if(!shared){syncBadge('이 기기 브라우저에 자동 저장됨',false);return;}
  clearTimeout(pushTimer); pushTimer=setTimeout(pushState,1200);
  syncBadge('공유 저장 중…',true);}
async function pushState(){ if(pushing){pushTimer=setTimeout(pushState,800);return;}
  pushing=true;
  try{const o=packState();
    const r=await fetch('api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
    if(r.ok){lastSeen=o.updatedAt;const d=new Date();
      syncBadge('공유 저장소에 저장됨 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'),true);}
    else syncBadge('공유 저장 실패 — 이 기기에만 저장됨',false);
  }catch(e){syncBadge('공유 저장 실패 — 이 기기에만 저장됨',false);}
  pushing=false;}
async function pullState(first){
  try{const r=await fetch('api/state',{cache:'no-store'}); if(!r.ok)throw 0;
    const o=await r.json();
    shared=true;
    if(o&&o.venues){
      if(first||(o.updatedAt!==lastSeen&&!painting&&Date.now()-lastLocal>10000)){
        applyState(o); lastSeen=o.updatedAt||0; render();
      }
      if(first)syncBadge('공유 저장소 연결됨 — 모두 같은 현황을 봅니다',true);
    }else{
      /* 서버가 비어 있으면 이 기기 저장분으로 시드 */
      try{const raw=localStorage.getItem(LSKEY);
        if(raw&&applyState(JSON.parse(raw))){render();schedulePersist();}
        else syncBadge('공유 저장소 연결됨(빈 상태)',true);
      }catch(x){syncBadge('공유 저장소 연결됨(빈 상태)',true);}
    }
  }catch(e){ if(first){shared=false;
    try{const raw=localStorage.getItem(LSKEY);
      if(raw&&applyState(JSON.parse(raw)))render();}catch(x){}
    syncBadge('이 기기 브라우저에 자동 저장됨',false);}}
}
window.arenaSync={pull:pullState,push:pushState};
tabs(); render();
pullState(true);
setInterval(()=>{if(shared&&!document.hidden)pullState(false);},15000);
})();
</script>
